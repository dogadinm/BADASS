frr defaults traditional
!
! P1 has no links or assigned IP addresses. Protocol instances are ready,
! but adjacencies are intentionally absent. P2/P3 supply their own configs.
log stdout informational
service integrated-vtysh-config
!
! Private AS for the base lab; this does not assign an interface address.
router bgp 65000
 no bgp default ipv4-unicast
 exit
!
router ospf
 passive-interface default
 exit
!
! IS-IS is running; a unique NET and enabled interfaces belong to a topology.
router isis P1
 is-type level-2-only
 exit
!
line vty
!
