frr defaults traditional
hostname router_dogadinm-1
log stdout informational
service integrated-vtysh-config
!
! OSPF carries underlay links and /32 loopbacks; BGP carries only EVPN.
interface eth0
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth1
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth2
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface lo
 ip ospf area 0
exit
!
router ospf
 ospf router-id 1.1.1.1
 passive-interface default
 no passive-interface eth0
 no passive-interface eth1
 no passive-interface eth2
exit
!
router bgp 65000
 bgp router-id 1.1.1.1
 no bgp default ipv4-unicast
 ! Dynamic iBGP clients are accepted only from the lab loopback range.
 neighbor LEAVES peer-group
 neighbor LEAVES remote-as 65000
 neighbor LEAVES update-source lo
 bgp listen range 1.1.1.0/29 peer-group LEAVES
 address-family l2vpn evpn
  neighbor LEAVES activate
  neighbor LEAVES route-reflector-client
 exit-address-family
exit
!
! IS-IS remains available from P1; this topology uses OSPF.
router isis P1
 is-type level-2-only
exit
!
line vty
!
